          NO_WEBSERVER: true
          USE_PREBUILT: true
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-admin-mock
          path: |
            playwright-report/
            test-results/**/*.png
          retention-days: 7

