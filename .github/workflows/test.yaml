          pnpm install --frozen-lockfile
      - name: Build Next.js example
        run: cd examples/hydra-nextjs && pnpm install --ignore-workspace && pnpm run build:test
        env:
          NEXT_PUBLIC_BACKEND_BASE_URL: http://localhost:8888
      - name: Install F7 example
        run: cd examples/hydra-vue-f7 && pnpm install --ignore-workspace
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          sudo tee /etc/apt/apt.conf.d/99-hydra-acquire >/dev/null <<'APTCONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APTCONF
          pnpm exec playwright install --with-deps chromium firefox
      - name: Install Playwright deps only
        # This step sat for 3h38m on one run. The log shows apt-get update stalling
        # mid-fetch of the Ubuntu package indexes — silent after
        # "Get:5 …noble-security InRelease", no output until the run was cancelled.
        # A stalled fetch, not a dpkg lock or a prompt. Retry and time-limit the
        # acquire so it fails fast, and bound the step as a backstop.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          sudo tee /etc/apt/apt.conf.d/99-hydra-acquire >/dev/null <<'APTCONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APTCONF
          pnpm exec playwright install-deps chromium firefox
      - name: Restore generated doc assets
        # Recorded by record-doc-assets this run; present so page-integrity's
        # broken-image check (sanity, after generation) sees the doc images.
        uses: actions/cache/restore@v4
        with:
          # The git-ignored screenshots AND the git-ignored demo video are
          # cached here; mtime-staleness regenerates only what changed. The demo
          # video switches to the F7 mobile frontend, which record-doc-assets
          # starts alongside Nuxt when a regen is needed.
          path: |
            docs/images
            docs/static/hydra-demo.mp4
          key: docs-assets-${{ github.sha }}
          restore-keys: docs-assets-
      - name: Start servers
        run: |
          node tests-playwright/fixtures/mock-api-server.cjs &
          npx vite --config tests-playwright/fixtures/test-frontend/vite.config.js &
          cd examples/hydra-nextjs && pnpm run start:test &
          cd examples/hydra-vue-f7 && VITE_API_BASE_URL=http://localhost:8888 npx vite --port 3008 --strictPort --config vite.config.test.mjs &
          sleep 3
      - name: Wait for servers
        run: |
          # Fail here if a server never came up. The old loop just ran out of
          # attempts and carried on, so a dead frontend reached the tests as 140
          # identical 30s timeouts ("no [data-block-uid] visible") and burned the
          # job's whole 45min budget — the symptom looked like 140 bugs.
          for port in 8888 8889 3007 3008; do
            echo "Waiting for port $port..."
            ready=""
            for i in {1..30}; do
              if curl -s http://localhost:$port > /dev/null; then ready=1; break; fi
              sleep 2
            done
            if [ -z "$ready" ]; then
              echo "::error::No server on port $port after 60s — check the Start servers step"
              exit 1
            fi
          done
          echo "All servers ready"
      - name: Run tests
        run: pnpm exec playwright test --project=nextjs --project=nextjs-firefox --project=f7 --reporter=github,list,html
        env:
          CI: true
          NO_WEBSERVER: true
          SKIP_VOLTO_CHECK: true
          # Without this, discovery never runs here, so block-sanity and
          # page-integrity found no .discovered-blocks.json and skipped — the
          # nextjs project is inside block-sanity's own scope, so it had simply
          # stopped being checked while the job reported green.
          DISCOVER_BLOCKS_API: http://localhost:8888
          # See the bridge-unit job: discovery needs a frontend. This job runs
          # two, and nominates nextjs.
          FRONTEND_URL: http://localhost:3007
          MOCK_PARENT_URL: http://localhost:8889/mock-parent.html
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nextjs-f7
          path: |
            playwright-report/
            test-results/**/*.png
          retention-days: 7
