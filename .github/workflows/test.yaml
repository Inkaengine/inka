name: Build and test

on:
  push:

# Every test port, stated. `tests-playwright/ports.ts` has no defaults on
# purpose — a checkout that fell back to these numbers could take over another
# checkout's servers without saying so — so CI declares them like any other
# caller. The values are the historical ones; a runner has the machine to
# itself, so there is nothing to avoid here.
env:
  HYDRA_MOCK_API_PORT: 8888
  HYDRA_TEST_FRONTEND_PORT: 8889
  HYDRA_MOCK_PARENT_PORT: 8891
  # The three-CMS journey's backends. Declared here with everything else
  # because PORTS is built eagerly: one missing name throws on import, so a
  # run that never touches Drupal still needs the name to exist.
  HYDRA_MOCK_DRUPAL_PORT: 8794
  HYDRA_WORDPRESS_PORT: 8795
  HYDRA_PLONE_SEED_PORT: 8898
  HYDRA_VOLTO_SSR_PORT: 3001
  HYDRA_VOLTO_WEBPACK_PORT: 3002
  HYDRA_NUXT_PORT: 3003
  HYDRA_REACT_DOC_PORT: 3004
  HYDRA_VUE_DOC_PORT: 3005
  HYDRA_SVELTE_DOC_PORT: 3006
  HYDRA_NEXTJS_PORT: 3007
  HYDRA_F7_PORT: 3008
  HYDRA_ASTRO_DOC_PORT: 3009

jobs:
  # ── Build Volto and upload artifact ──────────────────────────────────────
  build:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        run: |
          npm install -g corepack
          corepack cache clean
          corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: |
          pnpm dlx mrs-developer missdev --no-config --fetch-https
          pnpm install --frozen-lockfile
      - name: Run hydra-js unit tests
        run: cd packages/hydra-js && pnpm test
      - name: Build workspace deps (@plone/registry, @plone/components)
        # Volto 19 reads these via workspace symlinks but its razzle.config
        # requires their built dist/ output (create-addons-loader.cjs, etc.).
        # Also needed by vitest because the addon tests import via @plone/*
        # workspace aliases and the test-setup files touch the built dist/.
        run: pnpm build:deps
      - name: Run volto-hydra addon unit tests (vitest)
        run: pnpm test
      - name: Check example renderers compile
        # The examples pages embed real renderer files; check:docs parses each
        # per framework so a broken example fails here rather than shipping.
        run: pnpm check:docs
      - name: Run mock-api unit tests (node:test)
        # Plone 6.2 fidelity coverage (@aliases, SearchableText prefix
        # match, navigation, folder ordering). Was not previously wired
        # into CI even though the test file existed.
        run: pnpm test:api
      - name: Build Volto for production
        run: pnpm build
        env:
          RAZZLE_API_PATH: http://localhost:8888
          # RAZZLE_ vars are inlined into the CLIENT bundle at build time (webpack
          # DefinePlugin), so the frontend-switcher list the browser shows comes from
          # HERE, not from a downstream job's runtime env. Label the entries the demo
          # video narrates ("Nuxt blog", "F7 Mobile") and give F7 its hash-router
          # suffix so the switch lands on a rendered page, not a blank one.
          RAZZLE_DEFAULT_IFRAME_URL: "Test frontend|http://localhost:8889,Nuxt blog|http://localhost:3003,http://localhost:3004,http://localhost:3005,http://localhost:3006,http://localhost:3007,F7 Mobile|http://localhost:3008/#!"
          VOLTOCONFIG: ${{ github.workspace }}/volto.config.js
      - name: Upload Volto build
        uses: actions/upload-artifact@v4
        with:
          name: volto-build
          path: build/
          retention-days: 1

  # ── Record generated doc assets (screenshots + demo video) ───────────────
  # The editor screenshots + demo video the docs embed are git-ignored and
  # regenerated, not committed (see docs/.gitignore). This job is the ONLY one
  # with the full editor stack (Volto admin + Nuxt iframe) needed to drive the
  # live editor and record them. It restores the previous recording, so mtime
  # staleness (scripts/missing-doc-assets.mjs) regenerates ONLY what a spec or an
  # appearance dep changed since — fast when nothing did — then re-saves and runs
  # the media gate. The bridge jobs below depend on it so page-integrity's
  # broken-image check sees the images present. Sanity runs AFTER generation.
  record-doc-assets:
    needs: build
    runs-on: 'ubuntu-latest'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        run: |
          npm install -g corepack
          corepack cache clean
          corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: |
          pnpm dlx mrs-developer missdev --no-config --fetch-https
          pnpm install --frozen-lockfile
      - name: Build workspace deps (@plone/registry, @plone/components)
        run: pnpm build:deps
      - name: Download Volto build
        uses: actions/download-artifact@v4
        with:
          name: volto-build
          path: build/
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          sudo tee /etc/apt/apt.conf.d/99-hydra-acquire >/dev/null <<'APTCONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APTCONF
          pnpm exec playwright install --with-deps chromium firefox
      - name: Install Playwright deps only
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          sudo tee /etc/apt/apt.conf.d/99-hydra-acquire >/dev/null <<'APTCONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APTCONF
          pnpm exec playwright install-deps chromium firefox
      - name: Restore previous doc assets
        # Restore-only: mtime staleness then regenerates just what changed. The
        # prefix key picks up the most recent recording from any prior run.
        uses: actions/cache/restore@v4
        with:
          # The git-ignored screenshots AND the git-ignored demo video are
          # cached here; mtime-staleness regenerates only what changed. The demo
          # video switches to the F7 mobile frontend, which record-doc-assets
          # starts alongside Nuxt when a regen is needed.
          path: |
            docs/images
            docs/static/hydra-demo.mp4
          key: docs-assets-${{ github.sha }}
          restore-keys: docs-assets-
      - name: Install and build Nuxt
        # build:test bakes the LOCAL backend (localhost:8888) into the static
        # .output; without it preview:test serves the prod-backed build and every
        # /docs/examples/* is a 404 (the new content isn't on prod), so the
        # screenshots can't render. Same step the test-nuxt-* jobs use.
        run: cd examples/nuxt-blog-starter && pnpm install --ignore-workspace && pnpm run build:test
      - name: Install F7 mobile frontend
        # The demo video records a switch to the F7 mobile frontend, so its Vite
        # dev server (3008) must be up when the demo is regenerated.
        run: cd examples/hydra-vue-f7 && pnpm install --ignore-workspace
      - name: Install ffmpeg
        # demo:encode (tests-playwright/demo-video/encode.sh) trims the captured
        # .webm into the mp4 with ffmpeg. ubuntu-latest (24.04) no longer bundles
        # it, so install it here. Same apt acquire-hardening + step timeout the
        # Playwright deps step uses (a bare apt-get update once stalled 3h38m
        # mid-fetch of the Ubuntu package indexes).
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo tee /etc/apt/apt.conf.d/99-hydra-acquire >/dev/null <<'APTCONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APTCONF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - name: Start servers
        # The screenshot specs drive the Volto admin (3001) with the Nuxt iframe
        # (3003); mock-parent is served by the vite frontend (8889); content by
        # the mock API (8888). The demo video also switches to the F7 frontend
        # (3008), so the iframe list is labelled (the demo picks "F7 Mobile").
        run: |
          node tests-playwright/fixtures/mock-api-server.cjs &
          npx vite --config tests-playwright/fixtures/test-frontend/vite.config.js &
          cd examples/nuxt-blog-starter && pnpm run preview:test &
          cd "$GITHUB_WORKSPACE/examples/hydra-vue-f7" && pnpm run dev:test &
          cd "$GITHUB_WORKSPACE" && PORT=3001 RAZZLE_API_PATH=http://localhost:8888 \
            RAZZLE_DEFAULT_IFRAME_URL="Test frontend|http://localhost:8889,Nuxt blog|http://localhost:3003,F7 Mobile|http://localhost:3008/#!" \
            VOLTOCONFIG=${{ github.workspace }}/volto.config.js \
            pnpm start:prod &
          sleep 3
      - name: Wait for servers
        run: |
          for port in 8888 8889 3001 3003 3008; do
            echo "Waiting for port $port..."
            for i in {1..30}; do curl -s http://localhost:$port > /dev/null && break; sleep 2; done
          done
          echo "All servers ready"
      - name: Regenerate stale/absent doc assets
        run: pnpm docs:assets
        env:
          CI: true
          NO_WEBSERVER: true
          USE_PREBUILT: true
          CAPTURE_MOBILE_SCREENSHOTS: 1
      - name: Media gate — every referenced asset present
        run: pnpm docs:assets:check
      - name: Export test (images present)
        # The deployable-tar test needs every blob's bytes, so it runs here after
        # generation (it skips in the build job where the images are absent).
        run: node --test tests-playwright/fixtures/export-markdown-mount.test.cjs
      - name: Save doc assets
        uses: actions/cache/save@v4
        with:
          path: |
            docs/images
            docs/static/hydra-demo.mp4
          key: docs-assets-${{ github.sha }}
      - name: Upload doc assets (debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doc-assets
          path: |
            docs/images
            docs/static/hydra-demo.mp4
          retention-days: 3

  # ── Bridge + unit tests (no Volto needed) ────────────────────────────────
  test-bridge-unit:
    needs: record-doc-assets
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        run: |
          npm install -g corepack
          corepack cache clean
          corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: |
          pnpm dlx mrs-developer missdev --no-config --fetch-https
          pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          sudo tee /etc/apt/apt.conf.d/99-hydra-acquire >/dev/null <<'APTCONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APTCONF
          pnpm exec playwright install --with-deps chromium firefox
      - name: Install Playwright deps only
        # This step sat for 3h38m on one run. The log shows apt-get update stalling
        # mid-fetch of the Ubuntu package indexes — silent after
        # "Get:5 …noble-security InRelease", no output until the run was cancelled.
        # A stalled fetch, not a dpkg lock or a prompt. Retry and time-limit the
        # acquire so it fails fast, and bound the step as a backstop.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          sudo tee /etc/apt/apt.conf.d/99-hydra-acquire >/dev/null <<'APTCONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APTCONF
          pnpm exec playwright install-deps chromium firefox
      - name: Restore generated doc assets
        # Recorded by record-doc-assets this run; present so page-integrity's
        # broken-image check (sanity, after generation) sees the doc images.
        uses: actions/cache/restore@v4
        with:
          # The git-ignored screenshots AND the git-ignored demo video are
          # cached here; mtime-staleness regenerates only what changed. The demo
          # video switches to the F7 mobile frontend, which record-doc-assets
          # starts alongside Nuxt when a regen is needed.
          path: |
            docs/images
            docs/static/hydra-demo.mp4
          key: docs-assets-${{ github.sha }}
          restore-keys: docs-assets-
      - name: Start servers
        run: |
          node tests-playwright/fixtures/mock-api-server.cjs &
          npx vite --config tests-playwright/fixtures/test-frontend/vite.config.js &
          cd docs/examples/test-react && npx vite --port 3004 --strictPort &
          cd docs/examples/test-svelte && npx vite --port 3005 --strictPort &
          cd docs/examples/test-vue && npx vite --port 3006 --strictPort &
          cd docs/examples/test-astro && pnpm run dev:test &
          sleep 3
      - name: Wait for servers
        run: |
          for port in 8888 8889 3004 3005 3006 3009; do
            echo "Waiting for port $port..."
            for i in {1..30}; do
              curl -s http://localhost:$port > /dev/null && break
              sleep 2
            done
          done
          echo "All servers ready"
      - name: Run tests
        run: pnpm exec playwright test --project=unit --project=unit-firefox --project=api-contract --project=mock --project=react --project=svelte --project=vue --project=astro --reporter=github,list,html
        env:
          CI: true
          NO_WEBSERVER: true
          SKIP_VOLTO_CHECK: true
          DISCOVER_BLOCKS_API: http://localhost:8888
          # Discovery needs a frontend: without one it is type-only, container
          # regions are invisible, and the schema-dependent checks measure less
          # than they appear to. This job runs several frontends and discovery
          # runs once, so it nominates its primary — the vite test-frontend,
          # which carries the shared registry the fixtures are written against.
          # Per-frontend discovery would remove the need to choose.
          FRONTEND_URL: http://localhost:8889
          MOCK_PARENT_URL: http://localhost:8889/mock-parent.html
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-bridge-unit
          path: |
            playwright-report/
            test-results/**/*.png
          retention-days: 7

  # ── Admin integration tests (mock frontend) ─────────────────────────────
  # One contract suite, three CMSes, run at the same time.
  #
  # These assert that an adapter answers the canonical intents correctly against
  # a REAL backend for its CMS — the suite is identical per target, so a failure
  # names which CMS diverged rather than which test is flaky. Nothing here
  # touches the admin: it is the adapter contract alone.
  #
  # fail-fast is off because "WordPress broke" and "Drupal broke" are separate
  # findings, and cancelling the others hides the second one.
  test-adapter-contract:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [plone, wordpress, drupal]
    name: test-contract (${{ matrix.target }})
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        run: |
          npm install -g corepack
          corepack cache clean
          corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: |
          pnpm dlx mrs-developer missdev --no-config --fetch-https
          pnpm install --frozen-lockfile
      # WordPress is PHP-WASM fetched at boot, so it needs its own download and
      # is the slow one; the mock-backed targets skip this entirely.
      - name: Warm the WordPress Playground package
        if: matrix.target == 'wordpress'
        run: pnpm dlx @wp-playground/cli@3.1.51 --version || true
      - name: Run the contract suite
        run: TARGET=${{ matrix.target }} pnpm test:contract 2>&1 | tee /tmp/contract-${{ matrix.target }}.log
      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-${{ matrix.target }}
          path: /tmp/contract-${{ matrix.target }}.log
          if-no-files-found: ignore

  # The same editorial journey, walked in a browser against each CMS.
  #
  # Where the contract suite proves an adapter answers correctly, these prove the
  # ADMIN works over it: create a page, link to another, move it, upload an
  # image, change its state. Playwright's own config starts the right backend per
  # project (Drupal's mock, WordPress Playground), so the job only has to supply
  # a built Volto.
  #
  # WordPress is serialised inside its own project — PHP-WASM answers about one
  # request a second, and nine specs in parallel starve each other — but the
  # three CMSes still run as separate jobs at the same time here.
  test-adapter-journey:
    # Deliberately NOT `needs: build`. Depending on the shared build job means
    # the whole matrix skips whenever that job is red for reasons of its own —
    # which is what happened first time out, so adapter journeys were gated
    # behind breakage they have nothing to do with. Building Volto here costs a
    # few minutes per leg and buys a signal that is actually independent.
    runs-on: 'ubuntu-latest'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [journey-plone-seeded, journey-drupal, journey-wordpress]
    name: test-journey (${{ matrix.project }})
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        run: |
          npm install -g corepack
          corepack cache clean
          corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: |
          pnpm dlx mrs-developer missdev --no-config --fetch-https
          pnpm install --frozen-lockfile
      - name: Build workspace deps (@plone/registry, @plone/components)
        run: pnpm build:deps
      # No production build: these run against the DEV server, which is the
      # only mode the bridge currently works in. With USE_PREBUILT the prod
      # server SSRs while the client is set up to createRoot, and every test
      # failed on React hydration errors #418/#423 — the app never came up.
      # That is a real gap worth closing, but it is a product bug, not a reason
      # for CI to test a configuration nothing else does.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # No separate auth step for WordPress: journey-wordpress declares
      # `dependencies: ['journey-wordpress-setup']`, so Playwright mints the
      # credential itself with the servers this project needs already up.
      # Running the setup project on its own first made it fail three times over
      # before the real run started.
      - name: Run the journey
        run: pnpm exec playwright test --project=${{ matrix.project }} --reporter=github,list,html
        env:
          CI: true
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          if-no-files-found: ignore

  test-admin-mock:
    needs: build
    runs-on: 'ubuntu-latest'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        run: |
          npm install -g corepack
          corepack cache clean
          corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: |
          pnpm dlx mrs-developer missdev --no-config --fetch-https
          pnpm install --frozen-lockfile
      - name: Build workspace deps (@plone/registry, @plone/components)
        # pnpm start:prod loads these at runtime via workspace symlinks;
        # their dist/ output must exist or the SSR server fails to boot.
        run: pnpm build:deps
      - name: Download Volto build
        uses: actions/download-artifact@v4
        with:
          name: volto-build
          path: build/
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          sudo tee /etc/apt/apt.conf.d/99-hydra-acquire >/dev/null <<'APTCONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APTCONF
          pnpm exec playwright install --with-deps chromium firefox
      - name: Install Playwright deps only
        # This step sat for 3h38m on one run. The log shows apt-get update stalling
        # mid-fetch of the Ubuntu package indexes — silent after
        # "Get:5 …noble-security InRelease", no output until the run was cancelled.
        # A stalled fetch, not a dpkg lock or a prompt. Retry and time-limit the
        # acquire so it fails fast, and bound the step as a backstop.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          sudo tee /etc/apt/apt.conf.d/99-hydra-acquire >/dev/null <<'APTCONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APTCONF
