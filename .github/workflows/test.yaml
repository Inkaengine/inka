          # broken-image assertion (its link checks still run, so a typo'd path
          # is still caught); see PageIntegrityHelper.skipBrokenImages.
          SKIP_BROKEN_IMAGE_CHECK: true
          DISCOVER_BLOCKS_API: http://localhost:${{ env.HYDRA_MOCK_API_PORT }}
          FRONTEND_URL: http://localhost:${{ env.HYDRA_NUXT_PORT }}
          # Discovery reads the frontend's INIT through mock-parent. Without it
          # discovery is type-only: no container regions, so nested blocks are
          # invisible and every schema-dependent check passes by measuring
          # nothing. The server has always been up in this job (the test frontend, waited on
          # above) — the variable was simply never passed, while FRONTEND_URL
          # beside it was. globalSetup now fails rather than run type-only.
          MOCK_PARENT_URL: http://localhost:${{ env.HYDRA_TEST_FRONTEND_PORT }}/mock-parent.html
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nuxt-bridge
          path: |
            playwright-report/
            test-results/**/*.png
          retention-days: 7

  # ── Nuxt integration tests (needs Volto) ────────────────────────────────
  test-nuxt-admin:
    needs: build
    runs-on: 'ubuntu-latest'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        run: |
          npm install -g corepack
          corepack cache clean
          corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: |
          pnpm dlx mrs-developer missdev --no-config --fetch-https
          pnpm install --frozen-lockfile
      - name: Build workspace deps (@plone/registry, @plone/components)
        # pnpm start:prod loads these at runtime via workspace symlinks;
        # their dist/ output must exist or the SSR server fails to boot.
        run: pnpm build:deps
      - name: Download Volto build
        uses: actions/download-artifact@v4
        with:
          name: volto-build
          path: build/
      - name: Install and build Nuxt
        run: cd examples/nuxt-blog-starter && pnpm install --ignore-workspace && pnpm run build:test
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          sudo tee /etc/apt/apt.conf.d/99-hydra-acquire >/dev/null <<'APTCONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APTCONF
          pnpm exec playwright install --with-deps chromium firefox
      - name: Install Playwright deps only
        # This step sat for 3h38m on one run. The log shows apt-get update stalling
        # mid-fetch of the Ubuntu package indexes — silent after
        # "Get:5 …noble-security InRelease", no output until the run was cancelled.
        # A stalled fetch, not a dpkg lock or a prompt. Retry and time-limit the
        # acquire so it fails fast, and bound the step as a backstop.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          sudo tee /etc/apt/apt.conf.d/99-hydra-acquire >/dev/null <<'APTCONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APTCONF
          pnpm exec playwright install-deps chromium firefox
      - name: Start servers
        run: |
          node tests-playwright/fixtures/mock-api-server.cjs &
          npx vite --config tests-playwright/fixtures/test-frontend/vite.config.js &
          PORT=${{ env.HYDRA_VOLTO_SSR_PORT }} RAZZLE_API_PATH=http://localhost:${{ env.HYDRA_MOCK_API_PORT }} \
            RAZZLE_DEFAULT_IFRAME_URL=http://localhost:${{ env.HYDRA_TEST_FRONTEND_PORT }},http://localhost:${{ env.HYDRA_NUXT_PORT }} \
            VOLTOCONFIG=${{ github.workspace }}/volto.config.js \
            pnpm start:prod &
          cd examples/nuxt-blog-starter && pnpm run preview:test &
          sleep 3
      - name: Wait for servers
        run: |
          for port in ${{ env.HYDRA_MOCK_API_PORT }} ${{ env.HYDRA_TEST_FRONTEND_PORT }} ${{ env.HYDRA_VOLTO_SSR_PORT }} ${{ env.HYDRA_NUXT_PORT }}; do
            echo "Waiting for port $port..."
            for i in {1..30}; do curl -s http://localhost:$port > /dev/null && break; sleep 2; done
          done
          echo "All servers ready"
      - name: Run tests
        run: pnpm exec playwright test --project=admin-nuxt --project=nuxt-specific --reporter=github,list,html
        env:
          CI: true
          NO_WEBSERVER: true
          USE_PREBUILT: true
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nuxt-admin
          path: |
            playwright-report/
            test-results/**/*.png
          retention-days: 7

  # ── Next.js + F7 bridge tests (no Volto needed) ─────────────────────────
  test-nextjs-f7:
    needs: build
    runs-on: 'ubuntu-latest'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        run: |
          npm install -g corepack
          corepack cache clean
          corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: |
          pnpm dlx mrs-developer missdev --no-config --fetch-https
          pnpm install --frozen-lockfile
      - name: Build Next.js example
        run: cd examples/hydra-nextjs && pnpm install --ignore-workspace && pnpm run build:test
        env:
          NEXT_PUBLIC_BACKEND_BASE_URL: http://localhost:${{ env.HYDRA_MOCK_API_PORT }}
      - name: Install F7 example
        run: cd examples/hydra-vue-f7 && pnpm install --ignore-workspace
      - name: Install Svelte Quick Start
        run: cd docs/quickstart/svelte && pnpm install --ignore-workspace
      - name: Install Astro Quick Start
        run: cd docs/quickstart/astro && pnpm install --ignore-workspace
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          sudo tee /etc/apt/apt.conf.d/99-hydra-acquire >/dev/null <<'APTCONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APTCONF
          pnpm exec playwright install --with-deps chromium firefox
      - name: Install Playwright deps only
        # This step sat for 3h38m on one run. The log shows apt-get update stalling
        # mid-fetch of the Ubuntu package indexes — silent after
        # "Get:5 …noble-security InRelease", no output until the run was cancelled.
        # A stalled fetch, not a dpkg lock or a prompt. Retry and time-limit the
        # acquire so it fails fast, and bound the step as a backstop.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          sudo tee /etc/apt/apt.conf.d/99-hydra-acquire >/dev/null <<'APTCONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APTCONF
          pnpm exec playwright install-deps chromium firefox
      - name: Start servers
        run: |
          node tests-playwright/fixtures/mock-api-server.cjs &
          npx vite --config tests-playwright/fixtures/test-frontend/vite.config.js &
          cd examples/hydra-nextjs && pnpm run start:test &
          cd examples/hydra-vue-f7 && VITE_API_BASE_URL=http://localhost:${{ env.HYDRA_MOCK_API_PORT }} npx vite --port ${{ env.HYDRA_F7_PORT }} --strictPort --config vite.config.test.mjs &
          npx vite --port ${{ env.HYDRA_VANILLA_DOC_PORT }} --strictPort --config docs/quickstart/vanilla/vite.config.mjs &
          cd docs/quickstart/svelte && npx vite --port ${{ env.HYDRA_SVELTE_QS_PORT }} --strictPort &
          cd docs/quickstart/astro && npx astro dev --port ${{ env.HYDRA_ASTRO_QS_PORT }} &
          sleep 3
      - name: Wait for servers
        run: |
          # Fail here if a server never came up. The old loop just ran out of
          # attempts and carried on, so a dead frontend reached the tests as 140
          # identical 30s timeouts ("no [data-block-uid] visible") and burned the
          # job's whole 45min budget — the symptom looked like 140 bugs.
          for port in ${{ env.HYDRA_MOCK_API_PORT }} ${{ env.HYDRA_TEST_FRONTEND_PORT }} ${{ env.HYDRA_NEXTJS_PORT }} ${{ env.HYDRA_F7_PORT }} ${{ env.HYDRA_VANILLA_DOC_PORT }} ${{ env.HYDRA_SVELTE_QS_PORT }} ${{ env.HYDRA_ASTRO_QS_PORT }}; do
            echo "Waiting for port $port..."
            ready=""
            for i in {1..45}; do
              if curl -s http://localhost:$port > /dev/null; then ready=1; break; fi
              sleep 2
            done
            if [ -z "$ready" ]; then
              echo "::error::No server on port $port after 90s — check the Start servers step"
              exit 1
            fi
          done
          echo "All servers ready"
      - name: Run tests
        run: pnpm exec playwright test --project=nextjs --project=nextjs-firefox --project=f7 --project=vanilla --project=svelte-qs --project=astro-qs --reporter=github,list,html
        env:
          CI: true
          NO_WEBSERVER: true
          SKIP_VOLTO_CHECK: true
          # The editor screenshots the docs embed are git-ignored and generated
          # in the PARENT repo's deploy now, not recorded here — so they are
          # legitimately absent in this checkout. Skip page-integrity's
          # broken-image assertion (its link checks still run, so a typo'd path
          # is still caught); see PageIntegrityHelper.skipBrokenImages.
          SKIP_BROKEN_IMAGE_CHECK: true
          # Without this, discovery never runs here, so block-sanity and
          # page-integrity found no .discovered-blocks.json and skipped — the
          # nextjs project is inside block-sanity's own scope, so it had simply
          # stopped being checked while the job reported green.
          DISCOVER_BLOCKS_API: http://localhost:${{ env.HYDRA_MOCK_API_PORT }}
          # See the bridge-unit job: discovery needs a frontend. This job runs
          # two, and nominates nextjs.
          FRONTEND_URL: http://localhost:${{ env.HYDRA_NEXTJS_PORT }}
          MOCK_PARENT_URL: http://localhost:${{ env.HYDRA_TEST_FRONTEND_PORT }}/mock-parent.html
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nextjs-f7
          path: |
            playwright-report/
            test-results/**/*.png
          retention-days: 7
