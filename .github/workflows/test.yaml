  # ── Nuxt bridge tests (no Volto needed) ─────────────────────────────────
  test-nuxt-bridge:
    needs: record-doc-assets
    runs-on: 'ubuntu-latest'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        run: |
