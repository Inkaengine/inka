name: Build and test

on:
  push:

# The browser jobs run in a container, where a step's default shell is sh: bash
# ranges like {1..30} would not expand, and a wait loop would try once.
defaults:
  run:
    shell: bash

# Every test port, stated. `tests-playwright/ports.ts` has no defaults on
# purpose — a checkout that fell back to these numbers could take over another
# checkout's servers without saying so — so CI declares them like any other
# caller. The values are the historical ones; a runner has the machine to
# itself, so there is nothing to avoid here.
env:
  HYDRA_MOCK_API_PORT: 8888
  HYDRA_TEST_FRONTEND_PORT: 8889
  HYDRA_MOCK_PARENT_PORT: 8891
  HYDRA_VOLTO_SSR_PORT: 3001
  HYDRA_VOLTO_WEBPACK_PORT: 3002
  HYDRA_NUXT_PORT: 3003
  HYDRA_REACT_DOC_PORT: 3004
  HYDRA_VUE_DOC_PORT: 3005
  HYDRA_SVELTE_DOC_PORT: 3006
  HYDRA_NEXTJS_PORT: 3007
  HYDRA_F7_PORT: 3008
  HYDRA_ASTRO_DOC_PORT: 3009
  HYDRA_VANILLA_DOC_PORT: 3010
  HYDRA_SVELTE_QS_PORT: 3011
  HYDRA_ASTRO_QS_PORT: 3012

jobs:
  build:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        run: |
          npm install -g corepack
          corepack cache clean
          corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: |
          pnpm dlx mrs-developer missdev --no-config --fetch-https
          pnpm install --frozen-lockfile
      - name: Run hydra-js unit tests
        run: cd packages/hydra-js && pnpm test
      - name: Build workspace deps (@plone/registry, @plone/components)
        # Volto 19 reads these via workspace symlinks but its razzle.config
        # requires their built dist/ output (create-addons-loader.cjs, etc.).
        # Also needed by vitest because the addon tests import via @plone/*
        # workspace aliases and the test-setup files touch the built dist/.
        run: pnpm build:deps
      - name: Run volto-hydra addon unit tests (vitest)
        run: pnpm test
      - name: Check example renderers compile
        # The examples pages embed real renderer files; check:docs parses each
        # per framework so a broken example fails here rather than shipping.
        run: pnpm check:docs
      - name: Run mock-api unit tests (node:test)
        # Plone 6.2 fidelity coverage (@aliases, SearchableText prefix
        # match, navigation, folder ordering). Was not previously wired
        # into CI even though the test file existed.
        run: pnpm test:api
      - name: Check the served test content
        # Every mount the mock serves (docs, /_test_data fixtures, site root),
        # validated as one site. The mock refuses to start on the same errors;
        # checking here fails the build in seconds, naming the content, instead
        # of every test job timing out waiting for a server that exited.
        run: pnpm check:content
      - name: Build Volto for production
        run: pnpm build
        env:
          RAZZLE_API_PATH: http://localhost:${{ env.HYDRA_MOCK_API_PORT }}
          # RAZZLE_ vars are inlined into the CLIENT bundle at build time (webpack
          # DefinePlugin), so the frontend-switcher list the browser shows comes from
          # HERE, not from a downstream job's runtime env. Label the entries the demo
          # video narrates ("Nuxt blog", "F7 Mobile") and give F7 its hash-router
          # suffix so the switch lands on a rendered page, not a blank one.
          RAZZLE_DEFAULT_IFRAME_URL: "Test frontend|http://localhost:${{ env.HYDRA_TEST_FRONTEND_PORT }},Nuxt blog|http://localhost:${{ env.HYDRA_NUXT_PORT }},http://localhost:${{ env.HYDRA_REACT_DOC_PORT }},http://localhost:${{ env.HYDRA_VUE_DOC_PORT }},http://localhost:${{ env.HYDRA_SVELTE_DOC_PORT }},http://localhost:${{ env.HYDRA_NEXTJS_PORT }},F7 Mobile|http://localhost:${{ env.HYDRA_F7_PORT }}/#!"
          VOLTOCONFIG: ${{ github.workspace }}/volto.config.js
      - name: Upload Volto build
        uses: actions/upload-artifact@v4
        with:
          name: volto-build
          path: build/
          retention-days: 1

  # ── Plone backend addon (inkaengine.inka): the @templates endpoint ─────────
  # The JS side of @templates (the mock's endpoint, the loadTemplates helper, the merge
  # consuming it) runs in `build` above. This covers the Python addon that serves it on
  # a real Plone.
  test-admin-mock:
    strategy:
      fail-fast: false
      matrix:
        bridge: [current]
    needs: build
    runs-on: 'ubuntu-latest'
    timeout-minutes: 45
    # Playwright's own image: Node, git, the browsers for this Playwright
    # version and every system package they need, baked in. The jobs used to
    # apt-install those packages (100+ MB from the Ubuntu mirror) on every run,
    # and a slow mirror timed the step out; retries and a shorter acquire
    # timeout only made it fail faster. Keep the tag in step with
    # @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
      options: --ipc=host
    # The job runs as root, but $HOME is /github/home, which the image's pwuser
    # owns, and Firefox refuses to start as root in a home it doesn't own.
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        run: |
          npm install -g corepack
          corepack cache clean
          corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: |
          pnpm dlx mrs-developer missdev --no-config --fetch-https
          pnpm install --frozen-lockfile
      - name: Build workspace deps (@plone/registry, @plone/components)
        # pnpm start:prod loads these at runtime via workspace symlinks;
        # their dist/ output must exist or the SSR server fails to boot.
        run: pnpm build:deps
      - name: Download Volto build
        uses: actions/download-artifact@v4
        with:
          name: volto-build
          path: build/
      - name: Bridge variant
        if: matrix.bridge == 'before-fixes'
        run: cp hydra.src.before-fixes.js packages/hydra-js/hydra.src.js
      - name: Start servers
        run: |
          # The servers outlive this step, but its stdout does not: in a container
          # the step is a `docker exec` whose pipe closes when it ends, and the
          # next line a server logs kills it with EPIPE. Log to a file instead.
          exec > "$RUNNER_TEMP/servers.log" 2>&1
          node tests-playwright/fixtures/mock-api-server.cjs &
          npx vite --config tests-playwright/fixtures/test-frontend/vite.config.js &
          PORT=${{ env.HYDRA_VOLTO_SSR_PORT }} RAZZLE_API_PATH=http://localhost:${{ env.HYDRA_MOCK_API_PORT }} \
            RAZZLE_DEFAULT_IFRAME_URL=http://localhost:${{ env.HYDRA_TEST_FRONTEND_PORT }},http://localhost:${{ env.HYDRA_NUXT_PORT }} \
            VOLTOCONFIG=$GITHUB_WORKSPACE/volto.config.js \
            pnpm start:prod &
          sleep 3
      - name: Wait for servers
        run: |
          for port in ${{ env.HYDRA_MOCK_API_PORT }} ${{ env.HYDRA_TEST_FRONTEND_PORT }} ${{ env.HYDRA_VOLTO_SSR_PORT }}; do
            echo "Waiting for port $port..."
            for i in {1..30}; do curl -s http://localhost:$port > /dev/null && break; sleep 2; done
          done
          echo "All servers ready"
      - name: Run tests
        run: |
          pnpm exec playwright test --project=admin-mock --reporter=line --retries=0 --repeat-each=20 tests-playwright/integration/inline-editing-formatting.spec.ts -g "toggle on then off without typing preserves cursor"
          pnpm exec playwright test --project=admin-mock --reporter=line --retries=0 --repeat-each=3 tests-playwright/integration/inline-editing-formatting.spec.ts
        env:
          CI: true
          NO_WEBSERVER: true
          USE_PREBUILT: true
      - name: Server logs
        if: failure()
        run: cat "$RUNNER_TEMP/servers.log"
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-admin-mock
          path: |
            playwright-report/
            test-results/**/*.png
          retention-days: 7

  # ── Admin typing specs on the Next.js example ───────────────────────────
  # admin-mock and admin-nuxt rebuild or re-key their DOM on every render, so a
  # bug where the bridge edits DOM the frontend owns never shows there. The
  # Next.js example keeps its DOM between renders (stable keys), like a real
  # React frontend: the admin-driven typing flows — Enter/Backspace splits,
  # paste, markdown shortcuts, prospective formatting — run against it here.
