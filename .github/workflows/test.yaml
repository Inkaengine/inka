name: Build and test

on:
  push:

# Every test port, stated. `tests-playwright/ports.ts` has no defaults on
# purpose — a checkout that fell back to these numbers could take over another
# checkout's servers without saying so — so CI declares them like any other
# caller. The values are the historical ones; a runner has the machine to
# itself, so there is nothing to avoid here.
env:
  HYDRA_MOCK_API_PORT: 8888
  HYDRA_TEST_FRONTEND_PORT: 8889
  HYDRA_MOCK_PARENT_PORT: 8891
  HYDRA_VOLTO_SSR_PORT: 3001
  HYDRA_VOLTO_WEBPACK_PORT: 3002
  HYDRA_NUXT_PORT: 3003
  HYDRA_REACT_DOC_PORT: 3004
  HYDRA_VUE_DOC_PORT: 3005
  HYDRA_SVELTE_DOC_PORT: 3006
  HYDRA_NEXTJS_PORT: 3007
  HYDRA_F7_PORT: 3008
  HYDRA_ASTRO_DOC_PORT: 3009
  HYDRA_VANILLA_DOC_PORT: 3010
  HYDRA_SVELTE_QS_PORT: 3011
  HYDRA_ASTRO_QS_PORT: 3012

jobs:
  # ── Build Volto and upload artifact ──────────────────────────────────────
  build:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        run: |
          npm install -g corepack
          corepack cache clean
          corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: |
          pnpm dlx mrs-developer missdev --no-config --fetch-https
          pnpm install --frozen-lockfile
      - name: Run hydra-js unit tests
        run: cd packages/hydra-js && pnpm test
      - name: Build workspace deps (@plone/registry, @plone/components)
        # Volto 19 reads these via workspace symlinks but its razzle.config
        # requires their built dist/ output (create-addons-loader.cjs, etc.).
        # Also needed by vitest because the addon tests import via @plone/*
        # workspace aliases and the test-setup files touch the built dist/.
        run: pnpm build:deps
      - name: Run volto-hydra addon unit tests (vitest)
        run: pnpm test
      - name: Check example renderers compile
        # The examples pages embed real renderer files; check:docs parses each
        # per framework so a broken example fails here rather than shipping.
        run: pnpm check:docs
      - name: Run mock-api unit tests (node:test)
        # Plone 6.2 fidelity coverage (@aliases, SearchableText prefix
        # match, navigation, folder ordering). Was not previously wired
        # into CI even though the test file existed.
        run: pnpm test:api
      - name: Check the served test content
        # Every mount the mock serves (docs, /_test_data fixtures, site root),
        # validated as one site. The mock refuses to start on the same errors;
        # checking here fails the build in seconds, naming the content, instead
        # of every test job timing out waiting for a server that exited.
        run: pnpm check:content
      - name: Build Volto for production
        run: pnpm build
        env:
          RAZZLE_API_PATH: http://localhost:${{ env.HYDRA_MOCK_API_PORT }}
          # RAZZLE_ vars are inlined into the CLIENT bundle at build time (webpack
          # DefinePlugin), so the frontend-switcher list the browser shows comes from
          # HERE, not from a downstream job's runtime env. Label the entries the demo
          # video narrates ("Nuxt blog", "F7 Mobile") and give F7 its hash-router
          # suffix so the switch lands on a rendered page, not a blank one.
          RAZZLE_DEFAULT_IFRAME_URL: "Test frontend|http://localhost:${{ env.HYDRA_TEST_FRONTEND_PORT }},Nuxt blog|http://localhost:${{ env.HYDRA_NUXT_PORT }},http://localhost:${{ env.HYDRA_REACT_DOC_PORT }},http://localhost:${{ env.HYDRA_VUE_DOC_PORT }},http://localhost:${{ env.HYDRA_SVELTE_DOC_PORT }},http://localhost:${{ env.HYDRA_NEXTJS_PORT }},F7 Mobile|http://localhost:${{ env.HYDRA_F7_PORT }}/#!"
          VOLTOCONFIG: ${{ github.workspace }}/volto.config.js
      - name: Upload Volto build
        uses: actions/upload-artifact@v4
        with:
          name: volto-build
          path: build/
          retention-days: 1

  # ── Plone backend addon (inkaengine.inka): the @templates endpoint ─────────
  # The JS side of @templates (the mock's endpoint, the loadTemplates helper, the merge
  # consuming it) runs in `build` above. This covers the Python addon that serves it on
  # a real Plone.
  test-backend-addon:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        run: |
          npm install -g corepack
          corepack cache clean
          corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        # The addon's tests run against the SAME template fixtures as the JS suites: the
        # mock API exports them as a plone.exportimport distribution at test time, so the
        # repo's node dependencies are needed. With CI set, a missing fixture fails the
        # run instead of skipping the @templates tests.
        run: |
          pnpm dlx mrs-developer missdev --no-config --fetch-https
          pnpm install --frozen-lockfile
      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'backend/inkaengine.inka/.python-version'
      - name: Install uv
        # The addon's Makefile builds its virtualenv with uv (and mxdev, via uvx).
        run: pip install uv
      - name: Run addon tests (pytest)
        working-directory: backend/inkaengine.inka
        run: make test

  # ── Bridge + unit tests (no Volto needed) ────────────────────────────────
  test-bridge-unit:
    needs: build
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        run: |
          npm install -g corepack
          corepack cache clean
          corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: |
          pnpm dlx mrs-developer missdev --no-config --fetch-https
          pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          sudo tee /etc/apt/apt.conf.d/99-hydra-acquire >/dev/null <<'APTCONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APTCONF
          pnpm exec playwright install --with-deps chromium firefox
      - name: Install Playwright deps only
        # This step sat for 3h38m on one run. The log shows apt-get update stalling
        # mid-fetch of the Ubuntu package indexes — silent after
        # "Get:5 …noble-security InRelease", no output until the run was cancelled.
        # A stalled fetch, not a dpkg lock or a prompt. Retry and time-limit the
        # acquire so it fails fast, and bound the step as a backstop.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          sudo tee /etc/apt/apt.conf.d/99-hydra-acquire >/dev/null <<'APTCONF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          APTCONF
          pnpm exec playwright install-deps chromium firefox
      - name: Start servers
        run: |
          node tests-playwright/fixtures/mock-api-server.cjs &
          npx vite --config tests-playwright/fixtures/test-frontend/vite.config.js &
          cd docs/examples/test-react && npx vite --port ${{ env.HYDRA_REACT_DOC_PORT }} --strictPort &
          cd docs/examples/test-svelte && npx vite --port ${{ env.HYDRA_SVELTE_DOC_PORT }} --strictPort &
          cd docs/examples/test-vue && npx vite --port ${{ env.HYDRA_VUE_DOC_PORT }} --strictPort &
          cd docs/examples/test-astro && pnpm run dev:test &
          sleep 3
      - name: Wait for servers
        run: |
          for port in ${{ env.HYDRA_MOCK_API_PORT }} ${{ env.HYDRA_TEST_FRONTEND_PORT }} ${{ env.HYDRA_REACT_DOC_PORT }} ${{ env.HYDRA_VUE_DOC_PORT }} ${{ env.HYDRA_SVELTE_DOC_PORT }} ${{ env.HYDRA_ASTRO_DOC_PORT }}; do
            echo "Waiting for port $port..."
            for i in {1..30}; do
              curl -s http://localhost:$port > /dev/null && break
              sleep 2
            done
          done
          echo "All servers ready"
      - name: Run tests
        run: pnpm exec playwright test --project=unit --project=unit-firefox --project=api-contract --project=mock --project=react --project=svelte --project=vue --project=astro --reporter=github,list,html
        env:
          CI: true
          NO_WEBSERVER: true
          SKIP_VOLTO_CHECK: true
          # The editor screenshots the docs embed are git-ignored and generated
          # in the PARENT repo's deploy now, not recorded here — so they are
          # legitimately absent in this checkout. Skip page-integrity's
          # broken-image assertion (its link checks still run, so a typo'd path
          # is still caught); see PageIntegrityHelper.skipBrokenImages.
          SKIP_BROKEN_IMAGE_CHECK: true
          DISCOVER_BLOCKS_API: http://localhost:${{ env.HYDRA_MOCK_API_PORT }}
          # Discovery needs a frontend: without one it is type-only, container
          # regions are invisible, and the schema-dependent checks measure less
          # than they appear to. This job runs several frontends and discovery
          # runs once, so it nominates its primary — the vite test-frontend,
          # which carries the shared registry the fixtures are written against.
          # Per-frontend discovery would remove the need to choose.
          FRONTEND_URL: http://localhost:${{ env.HYDRA_TEST_FRONTEND_PORT }}
          MOCK_PARENT_URL: http://localhost:${{ env.HYDRA_TEST_FRONTEND_PORT }}/mock-parent.html
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-bridge-unit
          path: |
            playwright-report/
            test-results/**/*.png
          retention-days: 7

  # ── Admin integration tests (mock frontend) ─────────────────────────────
  test-admin-mock:
    needs: build
    runs-on: 'ubuntu-latest'
