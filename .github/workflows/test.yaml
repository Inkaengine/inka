name: Build and test

on:
  push:

jobs:
  # ── Build Volto and upload artifact ──────────────────────────────────────
  build:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        run: |
          npm install -g corepack
          corepack cache clean
          corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: |
          pnpm dlx mrs-developer missdev --no-config --fetch-https
          pnpm install --frozen-lockfile
      - name: Run hydra-js unit tests
        run: cd packages/hydra-js && pnpm test
      - name: Build workspace deps (@plone/registry, @plone/components)
        # Volto 19 reads these via workspace symlinks but its razzle.config
        # requires their built dist/ output (create-addons-loader.cjs, etc.).
        # Also needed by vitest because the addon tests import via @plone/*
        # workspace aliases and the test-setup files touch the built dist/.
        run: pnpm build:deps
      - name: Run volto-hydra addon unit tests (vitest)
        run: pnpm test
      - name: Check docs content is in sync with the markdown
        # docs/content/**/data.json is generated from docs/*.md by sync.mjs.
        # Nothing verified that it matched, so a markdown edit without a
        # re-sync shipped stale content to the site.
        run: pnpm sync:docs:check
      - name: Check the markdown tree agrees with the content JSON
        # Both formats are committed while the markdown is being adopted, so
        # something has to hold them together. This reconstructs every content
        # item from the markdown and compares it against the JSON the frontend
        # would be served -- not a file diff, which would pass on output that
        # no longer loads.
        run: pnpm check:content-md
      - name: Check markdown and JSON serve the same content
        # The stronger check: serve both formats and diff every path through
        # the API. The item-level check above compares a fixed list of keys and
        # passed while a Link's remoteUrl and every Event's start/end/location
        # were being dropped -- comparing what is actually served has no list
        # to be wrong about.
        run: pnpm check:content-parity
      - name: Run mock-api unit tests (node:test)
        # Plone 6.2 fidelity coverage (@aliases, SearchableText prefix
        # match, navigation, folder ordering). Was not previously wired
        # into CI even though the test file existed.
        run: pnpm test:api
      - name: Build Volto for production
        run: pnpm build
        env:
          RAZZLE_API_PATH: http://localhost:8888
          RAZZLE_DEFAULT_IFRAME_URL: http://localhost:8889,http://localhost:3003,http://localhost:3004,http://localhost:3005,http://localhost:3006,http://localhost:3007,http://localhost:3008
          VOLTOCONFIG: ${{ github.workspace }}/volto.config.js
      - name: Upload Volto build
        uses: actions/upload-artifact@v4
        with:
          name: volto-build
          path: build/
          retention-days: 1

  # ── Bridge + unit tests (no Volto needed) ────────────────────────────────
  test-bridge-unit:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        run: |
          npm install -g corepack
          corepack cache clean
          corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: |
          pnpm dlx mrs-developer missdev --no-config --fetch-https
          pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Install Playwright deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox
      - name: Start servers
        run: |
          node tests-playwright/fixtures/mock-api-server.cjs &
          npx vite --config tests-playwright/fixtures/test-frontend/vite.config.js &
          cd docs/examples/test-react && npx vite --port 3004 --strictPort &
          cd docs/examples/test-svelte && npx vite --port 3005 --strictPort &
          cd docs/examples/test-vue && npx vite --port 3006 --strictPort &
          cd docs/examples/test-astro && pnpm run dev:test &
          sleep 3
      - name: Wait for servers
        run: |
          for port in 8888 8889 3004 3005 3006 3009; do
            echo "Waiting for port $port..."
            for i in {1..30}; do
              curl -s http://localhost:$port > /dev/null && break
              sleep 2
            done
          done
          echo "All servers ready"
      - name: Run tests
        run: pnpm exec playwright test --project=unit --project=unit-firefox --project=api-contract --project=mock --project=react --project=svelte --project=vue --project=astro --reporter=github,list,html
        env:
          CI: true
          NO_WEBSERVER: true
          SKIP_VOLTO_CHECK: true
          DISCOVER_BLOCKS_API: http://localhost:8888
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-bridge-unit
          path: |
            playwright-report/
            test-results/**/*.png
          retention-days: 7

  # ── Admin integration tests (mock frontend) ─────────────────────────────
  # One contract suite, three CMSes, run at the same time.
  #
  # These assert that an adapter answers the canonical intents correctly against
  # a REAL backend for its CMS — the suite is identical per target, so a failure
  # names which CMS diverged rather than which test is flaky. Nothing here
  # touches the admin: it is the adapter contract alone.
  #
  # fail-fast is off because "WordPress broke" and "Drupal broke" are separate
  # findings, and cancelling the others hides the second one.
  test-adapter-contract:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [plone, wordpress, drupal]
    name: test-contract (${{ matrix.target }})
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        run: |
          npm install -g corepack
          corepack cache clean
          corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: |
          pnpm dlx mrs-developer missdev --no-config --fetch-https
          pnpm install --frozen-lockfile
      # WordPress is PHP-WASM fetched at boot, so it needs its own download and
      # is the slow one; the mock-backed targets skip this entirely.
      - name: Warm the WordPress Playground package
        if: matrix.target == 'wordpress'
        run: pnpm dlx @wp-playground/cli@3.1.51 --version || true
      - name: Run the contract suite
        run: TARGET=${{ matrix.target }} pnpm test:contract 2>&1 | tee /tmp/contract-${{ matrix.target }}.log
      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-${{ matrix.target }}
          path: /tmp/contract-${{ matrix.target }}.log
          if-no-files-found: ignore

  # The same editorial journey, walked in a browser against each CMS.
  #
  # Where the contract suite proves an adapter answers correctly, these prove the
  # ADMIN works over it: create a page, link to another, move it, upload an
  # image, change its state. Playwright's own config starts the right backend per
  # project (Drupal's mock, WordPress Playground), so the job only has to supply
  # a built Volto.
  #
  # WordPress is serialised inside its own project — PHP-WASM answers about one
  # request a second, and nine specs in parallel starve each other — but the
  # three CMSes still run as separate jobs at the same time here.
  test-adapter-journey:
    # Deliberately NOT `needs: build`. Depending on the shared build job means
    # the whole matrix skips whenever that job is red for reasons of its own —
    # which is what happened first time out, so adapter journeys were gated
    # behind breakage they have nothing to do with. Building Volto here costs a
    # few minutes per leg and buys a signal that is actually independent.
    runs-on: 'ubuntu-latest'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [journey-plone-seeded, journey-drupal, journey-wordpress]
    name: test-journey (${{ matrix.project }})
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        run: |
          npm install -g corepack
          corepack cache clean
          corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: |
          pnpm dlx mrs-developer missdev --no-config --fetch-https
          pnpm install --frozen-lockfile
      - name: Build workspace deps (@plone/registry, @plone/components)
        run: pnpm build:deps
      - name: Build Volto for production
        run: VOLTOCONFIG=${{ github.workspace }}/volto.config.js pnpm build
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # No separate auth step for WordPress: journey-wordpress declares
      # `dependencies: ['journey-wordpress-setup']`, so Playwright mints the
      # credential itself with the servers this project needs already up.
      # Running the setup project on its own first made it fail three times over
      # before the real run started.
      - name: Run the journey
        run: pnpm exec playwright test --project=${{ matrix.project }} --reporter=github,list,html
        env:
          CI: true
          USE_PREBUILT: true
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          if-no-files-found: ignore

  test-admin-mock:
    needs: build
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        run: |
          npm install -g corepack
          corepack cache clean
          corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: |
          pnpm dlx mrs-developer missdev --no-config --fetch-https
          pnpm install --frozen-lockfile
      - name: Build workspace deps (@plone/registry, @plone/components)
        # pnpm start:prod loads these at runtime via workspace symlinks;
        # their dist/ output must exist or the SSR server fails to boot.
        run: pnpm build:deps
      - name: Download Volto build
        uses: actions/download-artifact@v4
        with:
          name: volto-build
          path: build/
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Install Playwright deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox
      - name: Start servers
        run: |
          node tests-playwright/fixtures/mock-api-server.cjs &
          npx vite --config tests-playwright/fixtures/test-frontend/vite.config.js &
          PORT=3001 RAZZLE_API_PATH=http://localhost:8888 \
            RAZZLE_DEFAULT_IFRAME_URL=http://localhost:8889,http://localhost:3003 \
            VOLTOCONFIG=${{ github.workspace }}/volto.config.js \
            pnpm start:prod &
          sleep 3
      - name: Wait for servers
        run: |
          for port in 8888 8889 3001; do
            echo "Waiting for port $port..."
            for i in {1..30}; do curl -s http://localhost:$port > /dev/null && break; sleep 2; done
          done
          echo "All servers ready"
      - name: Run tests
        run: pnpm exec playwright test --project=admin-mock --reporter=github,list,html
        env:
          CI: true
          NO_WEBSERVER: true
          USE_PREBUILT: true
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-admin-mock
          path: |
            playwright-report/
            test-results/**/*.png
          retention-days: 7

  # ── Nuxt bridge tests (no Volto needed) ─────────────────────────────────
  test-nuxt-bridge:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        run: |
          npm install -g corepack
          corepack cache clean
          corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: |
          pnpm dlx mrs-developer missdev --no-config --fetch-https
          pnpm install --frozen-lockfile
      - name: Install and build Nuxt
        run: cd examples/nuxt-blog-starter && pnpm install --ignore-workspace && pnpm run build:test
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Install Playwright deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox
      - name: Start servers
        run: |
          node tests-playwright/fixtures/mock-api-server.cjs &
          npx vite --config tests-playwright/fixtures/test-frontend/vite.config.js &
          cd examples/nuxt-blog-starter && pnpm run preview:test &
          sleep 3
      - name: Wait for servers
        run: |
          for port in 8888 8889 3003; do
            echo "Waiting for port $port..."
            for i in {1..30}; do curl -s http://localhost:$port > /dev/null && break; sleep 2; done
          done
          echo "All servers ready"
      - name: Run tests
        run: pnpm exec playwright test --project=nuxt --project=nuxt-firefox --reporter=github,list,html
        env:
          CI: true
          NO_WEBSERVER: true
          SKIP_VOLTO_CHECK: true
          DISCOVER_BLOCKS_API: http://localhost:8888
          FRONTEND_URL: http://localhost:3003
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nuxt-bridge
          path: |
            playwright-report/
            test-results/**/*.png
          retention-days: 7

  # ── Nuxt integration tests (needs Volto) ────────────────────────────────
  test-nuxt-admin:
    needs: build
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        run: |
          npm install -g corepack
          corepack cache clean
          corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: |
          pnpm dlx mrs-developer missdev --no-config --fetch-https
          pnpm install --frozen-lockfile
      - name: Build workspace deps (@plone/registry, @plone/components)
        # pnpm start:prod loads these at runtime via workspace symlinks;
        # their dist/ output must exist or the SSR server fails to boot.
        run: pnpm build:deps
      - name: Download Volto build
        uses: actions/download-artifact@v4
        with:
          name: volto-build
          path: build/
      - name: Install and build Nuxt
        run: cd examples/nuxt-blog-starter && pnpm install --ignore-workspace && pnpm run build:test
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v2-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Install Playwright deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox
      - name: Start servers
        run: |
          node tests-playwright/fixtures/mock-api-server.cjs &
          npx vite --config tests-playwright/fixtures/test-frontend/vite.config.js &
          PORT=3001 RAZZLE_API_PATH=http://localhost:8888 \
            RAZZLE_DEFAULT_IFRAME_URL=http://localhost:8889,http://localhost:3003 \
            VOLTOCONFIG=${{ github.workspace }}/volto.config.js \
            pnpm start:prod &
