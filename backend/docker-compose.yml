# A real Plone backend for trying the example frontends against, with the add-on
# they use to bring their forced layouts with the page
# (collective.restapi.searchexpansion; see docs/frontend-guide/templates.md).
#
#     make backend-start      # this file
#     make backend-seed       # load the shared templates + docs
#
# Distinct from `make backend-docker-start`, which runs the stock plone/server-dev:6 with
# no add-on — that one is for checking the mock against vanilla Plone.
#
# ADDONS is the image's own mechanism: pip installs each entry into the venv Plone runs
# from. The add-on has no profile, so nothing needs applying at site creation.
services:
  backend:
    image: plone/server-dev:6
    ports:
      - "8080:8080"
    environment:
      SITE: Plone
      CORS_ALLOW_ORIGIN: "*"
      ADDONS: "git+https://github.com/collective/collective.restapi.searchexpansion.git@884367a297ac3c512bd54b062062380652a097c8"
    volumes:
      # Keep the ZODB across restarts so content created while trialling survives.
      - inka-plone-data:/data
      # Caching the wheels makes later boots quick.
      - inka-pip-cache:/root/.cache/pip

volumes:
  inka-plone-data:
  inka-pip-cache:
